services:
  gliv:
    image: great-love-immortal-venerable:local
    build: .
    container_name: great-love-immortal-venerable
    restart: unless-stopped
    user: "${GLIV_UID:-1654}:${GLIV_GID:-1654}"
    env_file: bot.env
    volumes:
      - /run/gliv:/run/gliv:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
